spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:onharu;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    openai:
      api-key: dummy
      chat:
        base-url: https://api.openai.com
        completions-path: /v1/chat/completions
        options:
          model: gpt-4o-mini

server:
  port: 8080

push:
  vapid:
    subject: "mailto:local@onharu"
    public-key: test-public-key
    private-key: test-private-key

naver:
  ocr:
    url: https://example.com/ocr
    secret: test-secret

scheduler:
  medicine-alarm:
    cron: "0 */10 * * * *"
    enabled: false
